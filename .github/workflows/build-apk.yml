# Builds a debug APK on every push to main and publishes it as a GitHub Release,
# so it can be downloaded straight to a phone. Free on GitHub Actions.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # One-time cleanup of a temporary news-source check (safe to delete this step later).
      - name: Remove temporary probe releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("probe-"))'); do
            gh release delete "$t" -y --cleanup-tag
          done
          git push origin --delete probe || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME is set).
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee -a build.log

      # Surface compiler errors as an annotation so they are easy to read.
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|FAILED" -A4 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NihongoSRS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NihongoSRS-apk
          path: NihongoSRS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nihongo SRS build ${{ github.run_number }}
          body: Download NihongoSRS.apk below and open it on your Android phone.
          files: NihongoSRS.apk

  # Opens the new version in an Android emulator, walks through every screen and
  # attaches screenshots + a video to the release, so it can be checked before installing.
  preview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: preview-apks
          path: app/build/outputs/apk

      - name: Run app tour in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/preview.sh

      - name: Report tour result
        if: always()
        run: |
          ls -la preview || true
          msg=$(tail -40 preview/tour.log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=Tour log::${msg}"

      - name: Attach preview to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(preview/*.png preview/walkthrough.mp4)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload build-${{ github.run_number }} "${files[@]}" --clobber -R ${{ github.repository }}
          fi
